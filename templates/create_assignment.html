{% extends "base.html" %}{% block title %}Create Assignment | CampusHub{% endblock %}{% block content %}<div class="form-page"><span class="eyebrow">FACULTY WORKSPACE</span><h1>Create assignment</h1><p>Publish an academic task for students.</p><form class="panel form" method="post"><label>Assignment title *<input name="title" required maxlength="120" placeholder="e.g. Linked List Exercises"></label><label>Subject *<input name="subject" required maxlength="80" placeholder="e.g. Data Structures"></label><label>Instructions *<textarea name="description" required rows="5" maxlength="1500" placeholder="Enter task details and submission instructions"></textarea></label><label>Due date *<input type="date" name="due_date" required></label><button class="btn primary">Publish assignment</button></form></div>{% endblock %}
