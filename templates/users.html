{% extends "base.html" %}{% block title %}Users | CampusHub{% endblock %}{% block content %}<div class="page-head"><div><span class="eyebrow">ADMINISTRATION</span><h1>Registered users</h1><p>Demo accounts available in this project.</p></div></div><div class="panel table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td><span class="status">{{ u.role|title }}</span></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
