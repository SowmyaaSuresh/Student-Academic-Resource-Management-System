{% extends "base.html" %}{% block title %}Upload Resource | CampusHub{% endblock %}{% block content %}<div class="form-page"><span class="eyebrow">SHARE KNOWLEDGE</span><h1>Upload study resource</h1><p>Add a document for students to access.</p><form class="panel form" method="post" enctype="multipart/form-data"><label>Resource title *<input name="title" required maxlength="120" placeholder="e.g. Unit 1 Lecture Notes"></label><label>Subject *<input name="subject" required maxlength="80" placeholder="e.g. Data Structures"></label><label>Description<textarea name="description" rows="3" maxlength="500" placeholder="Briefly describe this material"></textarea></label><label>Choose file *<input type="file" name="file" required accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.png,.jpg,.jpeg,.zip"></label><small class="hint">Allowed: PDF, DOC/DOCX, PPT/PPTX, TXT, PNG/JPG, ZIP. Maximum 10 MB.</small><button class="btn primary">Upload resource</button></form></div>{% endblock %}
