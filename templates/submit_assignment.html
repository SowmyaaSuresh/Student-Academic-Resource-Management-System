{% extends "base.html" %}{% block title %}Submit Assignment | CampusHub{% endblock %}{% block content %}<div class="form-page"><span class="eyebrow">{{ assignment.subject }}</span><h1>{{ assignment.title }}</h1><p>{{ assignment.description }}</p><div class="panel form"><p><b>Due date:</b> {{ assignment.due_date }}</p><form method="post"><label>Your answer / submission note *<textarea name="answer" rows="7" required placeholder="Enter your answer or explain where your completed work is stored...">{{ previous.answer if previous else '' }}</textarea></label><button class="btn primary">Submit assignment</button></form></div></div>{% endblock %}
